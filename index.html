<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friends</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: min(1100px, 94%);
  margin: 20px auto;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h1,
h2,
h3 {
  margin-top: 0;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  margin-bottom: 10px;
  outline: none;
}

input:focus,
textarea:focus {
  border-color: #6366f1;
}

textarea {
  resize: vertical;
  min-height: 80px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  margin: 3px;
  background: #4f46e5;
  color: white;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.success-btn {
  background: #16a34a;
}

.danger-btn {
  background: #dc2626;
}

.secondary-btn {
  background: #6b7280;
}

.warning-btn {
  background: #d97706;
}

.hidden {
  display: none !important;
}

.message {
  padding: 12px;
  background: #f3f4f6;
  border-radius: 10px;
  margin: 7px 0;
}

.error {
  color: #b91c1c;
  background: #fee2e2;
}

.success {
  color: #166534;
  background: #dcfce7;
}

.loading {
  padding: 15px;
  text-align: center;
}

.small {
  color: #6b7280;
  font-size: 13px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.username {
  font-weight: bold;
  color: #4f46e5;
}

.auth-tabs {
  display: flex;
  gap: 5px;
  margin-bottom: 15px;
}

.auth-tabs button {
  flex: 1;
}

.auth-tabs .active {
  background: #111827;
}

.app-grid {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 16px;
}

.sidebar {
  min-width: 0;
}

.chat-area {
  min-width: 0;
}

.user-result {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}

.user-result strong {
  display: block;
  margin-bottom: 8px;
}

.request-item,
.conversation-item {
  border: 1px solid #e5e7eb;
  padding: 11px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.conversation-item {
  cursor: pointer;
}

.conversation-item:hover {
  background: #f9fafb;
}

.conversation-item.active {
  background: #eef2ff;
  border-color: #6366f1;
}

.unread {
  font-weight: bold;
  border-color: #f59e0b;
}

.badge {
  display: inline-block;
  background: #dc2626;
  color: white;
  border-radius: 20px;
  padding: 2px 7px;
  font-size: 12px;
  margin-left: 5px;
}

.chat-header {
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 12px;
  margin-bottom: 12px;
}

.messages {
  height: 450px;
  overflow-y: auto;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  background: #fafafa;
}

.chat-message {
  display: flex;
  margin: 8px 0;
}

.chat-message.mine {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 10px 13px;
  border-radius: 14px;
  background: #e5e7eb;
  word-break: break-word;
}

.mine .bubble {
  background: #4f46e5;
  color: white;
}

.message-time {
  font-size: 10px;
  opacity: .65;
  margin-top: 4px;
}

.message-expiry {
  font-size: 10px;
  opacity: .65;
  margin-top: 2px;
}

.send-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.send-row textarea {
  margin: 0;
  min-height: 55px;
}

.send-row button {
  width: 110px;
}

.file-send-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
  flex-wrap: wrap;
}

.file-send-row input[type="file"] {
  flex: 1;
  min-width: 180px;
  margin: 0;
}

.file-send-row button {
  white-space: nowrap;
}

.chat-file {
  margin-top: 5px;
}

.chat-file-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.chat-file-size {
  font-size: 11px;
  opacity: .7;
}

.delete-message-btn {
  margin-top: 7px;
  padding: 5px 9px;
  font-size: 11px;
  background: #dc2626;
}

.open-chat-file-btn {
  padding: 7px 10px;
  margin-top: 7px;
  font-size: 12px;
  background: #16a34a;
}

.file-item {
  border: 1px solid #e5e7eb;
  border-radius: 9px;
  padding: 10px;
  margin-bottom: 8px;
}

@media (max-width: 750px) {

  .container {
    width: 96%;
    margin: 10px auto;
  }

  .app-grid {
    grid-template-columns: 1fr;
  }

  .messages {
    height: 55vh;
  }

  .send-row {
    align-items: stretch;
  }

  .send-row button {
    width: 90px;
  }

  .bubble {
    max-width: 85%;
  }

  .file-send-row {
    display: block;
  }

  .file-send-row input {
    margin-bottom: 5px;
  }

  .file-send-row button {
    width: 100%;
  }

}

</style>
</head>

<body>

<div class="container">

      <input

      <button

  <div id="appScreen" class="hidden">

    <div class="app-grid">

          <h3>🔎 მომხმარებლის ძებნა</h3>

          <input
            id="searchUsername"
            type="text"

          >

          </button>

        </div>


        <div class="card">

        <div class="card">

      <div class="chat-area">

                id="chatFileInput"

                📎 ფაილის გაგზავნა

            <div
              id="messageStatus"
              class="small"
            ></div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

"use strict";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ihuiepozcsptkxslpgjb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iM_PP_hIpGCsAPn1-lAj3w_FH9kI3fS";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   HELPERS
========================================================= */

function $(id) {
  return document.getElementById(id);
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function showMessage(
  element,
  text,
  type = ""
) {

  element.innerHTML =
    `<div class="message ${type}">
      ${escapeHtml(text)}
    </div>`;

}


function formatTime(date) {

  return new Date(date).toLocaleString(
    "ka-GE",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function formatFileSize(bytes) {

  if (!bytes || bytes < 1) {
    return "0 B";
  }

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {
    return (bytes / 1024).toFixed(1) + " KB";
  }

  if (bytes < 1024 * 1024 * 1024) {
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";
}


function safeFileName(name) {

  return String(name || "file")
    .replace(/[\\\/:*?"<>|]/g, "_")
    .replace(/[\u0000-\u001F]/g, "_")
    .substring(0, 180);

}


function getExpiryDate() {

  return new Date(
    Date.now() +
    2 * 24 * 60 * 60 * 1000
  ).toISOString();

}


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentProfile = null;

let selectedUser = null;

let messageChannel = null;

let friendRequestChannel = null;

let pollingTimer = null;

let isLoadingMessages = false;

let lastMessageRenderKey = "";

let lastConversationRenderKey = "";

let lastFriendRequestRenderKey = "";

let searchRequestId = 0;

let appStarting = false;

let appStarted = false;


/* =========================================================
   AUTH UI
========================================================= */

$("loginTab").addEventListener(
  "click",
  function() {

    $("loginBox").classList.remove("hidden");
    $("registerBox").classList.add("hidden");
    $("forgotBox").classList.add("hidden");
    $("recoveryBox").classList.add("hidden");

    $("loginTab").classList.add("active");
    $("registerTab").classList.remove("active");

  }
);


$("registerTab").addEventListener(
  "click",
  function() {

    $("loginBox").classList.add("hidden");
    $("registerBox").classList.remove("hidden");
    $("forgotBox").classList.add("hidden");
    $("recoveryBox").classList.add("hidden");

    $("registerTab").classList.add("active");
    $("loginTab").classList.remove("active");

  }
);


$("forgotBtn").addEventListener(
  "click",
  function() {

    $("loginBox").classList.add("hidden");
    $("forgotBox").classList.remove("hidden");

  }
);


$("backLoginBtn").addEventListener(
  "click",
  function() {

    $("forgotBox").classList.add("hidden");
    $("loginBox").classList.remove("hidden");

  }
);


/* =========================================================
   REGISTER
========================================================= */

$("registerBtn").addEventListener(
  "click",
  register
);


async function register() {

  const username =
    $("registerUsername").value.trim();

  const email =
    $("registerEmail").value.trim();

  const password =
    $("registerPassword").value;

  const password2 =
    $("registerPassword2").value;


  $("registerMessage").innerHTML = "";


  if (!username) {

    showMessage(
      $("registerMessage"),
      "შეიყვანე username.",
      "error"
    );

    return;
  }


  if (!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)) {

    showMessage(
      $("registerMessage"),
      "Username უნდა იყოს 3-30 სიმბოლო და შეიცავდეს მხოლოდ ლათინურ ასოებს, ციფრებს, წერტილს, _ ან -.",
      "error"
    );

    return;
  }


  if (!email) {

    showMessage(
      $("registerMessage"),
      "შეიყვანე ელფოსტა.",
      "error"
    );

    return;
  }


  if (password.length < 6) {

    showMessage(
      $("registerMessage"),
      "პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.",
      "error"
    );

    return;
  }


  if (password !== password2) {

    showMessage(
      $("registerMessage"),
      "პაროლები ერთმანეთს არ ემთხვევა.",
      "error"
    );

    return;
  }


  $("registerBtn").disabled = true;
  $("registerBtn").textContent = "რეგისტრაცია...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email,
        password,

        options: {
          data: {
            username
          }
        }

      });


    if (error) {
      throw error;
    }


    if (!data.user) {

      throw new Error(
        "მომხმარებლის შექმნა ვერ მოხერხდა."
      );

    }


    showMessage(
      $("registerMessage"),
      "რეგისტრაცია წარმატებით დასრულდა. ახლა შედი სისტემაში.",
      "success"
    );


    $("loginUsername").value = username;

    $("loginBox").classList.remove("hidden");
    $("registerBox").classList.add("hidden");

    $("loginTab").classList.add("active");
    $("registerTab").classList.remove("active");


  } catch (error) {

    console.error(error);

    let message =
      error.message ||
      "რეგისტრაციისას მოხდა შეცდომა.";


    if (
      error.code === "23505" ||
      message.toLowerCase().includes("username")
    ) {

      message =
        "ეს username უკვე დაკავებულია.";

    }


    showMessage(
      $("registerMessage"),
      message,
      "error"
    );

  } finally {

    $("registerBtn").disabled = false;
    $("registerBtn").textContent = "რეგისტრაცია";

  }

}


/* =========================================================
   LOGIN
========================================================= */

$("loginBtn").addEventListener(
  "click",
  login
);


async function login() {

  const username =
    $("loginUsername").value.trim();

  const password =
    $("loginPassword").value;


  $("loginMessage").innerHTML = "";


  if (!username || !password) {

    showMessage(
      $("loginMessage"),
      "შეავსე username და პაროლი.",
      "error"
    );

    return;
  }


  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "შესვლა...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "find_profile_login",
        {
          search_username: username
        }
      );


    if (error) {
      throw error;
    }


    if (!data || data.length === 0) {

      throw new Error(
        "ასეთი username ვერ მოიძებნა."
      );

    }


    const email =
      data[0].email;


    const {
      error: loginError
    } =
      await supabaseClient.auth.signInWithPassword({

        email,
        password

      });


    if (loginError) {
      throw loginError;
    }


    await startApp();


  } catch (error) {

    console.error(error);

    showMessage(
      $("loginMessage"),
      error.message,
      "error"
    );

  } finally {

    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "შესვლა";

  }

}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

$("sendResetBtn").addEventListener(
  "click",
  sendPasswordReset
);


async function sendPasswordReset() {

  const username =
    $("forgotUsername").value.trim();


  if (!username) {

    showMessage(
      $("forgotMessage"),
      "შეიყვანე username.",
      "error"
    );

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "find_profile_login",
        {
          search_username: username
        }
      );


    if (error) {
      throw error;
    }


    if (!data || data.length === 0) {

      throw new Error(
        "ასეთი username ვერ მოიძებნა."
      );

    }


    const email =
      data[0].email;


    const redirectUrl =
      window.location.origin +
      window.location.pathname;


    const {
      error: resetError
    } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );


    if (resetError) {
      throw resetError;
    }


    showMessage(
      $("forgotMessage"),
      "პაროლის აღდგენის ბმული გაიგზავნა ელფოსტაზე.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      $("forgotMessage"),
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RECOVERY
========================================================= */

$("changePasswordBtn").addEventListener(
  "click",
  changePassword
);


async function changePassword() {

  const password =
    $("newPassword").value;

  const password2 =
    $("newPassword2").value;


  if (password.length < 6) {

    showMessage(
      $("recoveryMessage"),
      "პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.",
      "error"
    );

    return;
  }


  if (password !== password2) {

    showMessage(
      $("recoveryMessage"),
      "პაროლები ერთმანეთს არ ემთხვევა.",
      "error"
    );

    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password
      });


    if (error) {
      throw error;
    }


    showMessage(
      $("recoveryMessage"),
      "პაროლი წარმატებით შეიცვალა.",
      "success"
    );


    setTimeout(
      async function() {

        await supabaseClient.auth.signOut();

        window.location.reload();

      },
      1500
    );


  } catch (error) {

    showMessage(
      $("recoveryMessage"),
      error.message,
      "error"
    );

  }

}


/* =========================================================
   START APP
========================================================= */

async function startApp() {

  if (appStarted || appStarting) {
    return;
  }


  appStarting = true;


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (error || !data.user) {
      return;
    }


    currentUser =
      data.user;


    const {
      data: profileData,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("id, username")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (profileError) {
      throw profileError;
    }


    if (!profileData) {

      throw new Error(
        "პროფილი ვერ მოიძებნა."
      );

    }


    currentProfile =
      profileData;


    $("currentUsername").textContent =
      currentProfile.username;


    $("authScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");


    await loadFriendRequests();
    await loadConversations();
    await loadFiles();

    subscribeRealtime();
    startPolling();


    appStarted = true;


  } finally {

    appStarting = false;

  }

}

async function searchUser() {

  const username =
    $("searchUsername").value.trim();


  const requestId =
    ++searchRequestId;


  $("searchResult").innerHTML = "";


  if (!username) {

    showMessage(
      $("searchResult"),
      "შეიყვანე მომხმარებლის სახელი."
    );

    return;
  }


  $("searchResult").innerHTML =
    `<div class="loading">
      🔎 ვეძებ...
    </div>`;


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "find_profile_by_username",
        {
          search_username: username
        }
      );


    if (requestId !== searchRequestId) {
      return;
    }


    if (error) {
      throw error;
    }


    const users =
      (data || []).filter(
        function(user) {

          return (
            currentUser &&
            user.id !== currentUser.id
          );

        }
      );


    if (users.length === 0) {

      showMessage(
        $("searchResult"),
        "მომხმარებელი ვერ მოიძებნა."
      );

      return;

    }


    $("searchResult").innerHTML = "";


    for (const user of users) {

      const box =
        document.createElement("div");


      box.className =
        "user-result";


      box.innerHTML =
        `<strong>
          👤 ${escapeHtml(user.username)}
        </strong>

        <button class="add-btn success-btn">
          👥 დამატება
        </button>

        <button class="chat-btn">
          💬 ჩატი
        </button>

        <div class="relationship"></div>`;


      box
        .querySelector(".add-btn")
        .addEventListener(
          "click",
          async function() {

            await sendFriendRequest(user);

            if (document.body.contains(box)) {

              await renderRelationship(
                user,
                box
              );

            }

          }
        );


      box
        .querySelector(".chat-btn")
        .addEventListener(
          "click",
          async function() {

            await selectUser(user);

          }
        );


      $("searchResult").appendChild(box);


      await renderRelationship(
        user,
        box
      );

    }


  } catch (error) {

    console.error("Search error:", error);

    showMessage(
      $("searchResult"),
      "ძებნის შეცდომა: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RELATIONSHIP
========================================================= */

async function renderRelationship(
  user,
  box
) {

  if (
    !box ||
    !document.body.contains(box)
  ) {
    return;
  }


  const relationship =
    box.querySelector(".relationship");

  const addBtn =
    box.querySelector(".add-btn");


  const {
    data: friendshipData,
    error: friendshipError
  } =
    await supabaseClient
      .from("friendships")
      .select("id")
      .or(
        "and(user_id.eq." +
        currentUser.id +
        ",friend_id.eq." +
        user.id +
        "),and(user_id.eq." +
        user.id +
        ",friend_id.eq." +
        currentUser.id +
        ")"
      )
      .limit(1);


  if (friendshipError) {
    console.error(friendshipError);
  }


  if (
    friendshipData &&
    friendshipData.length > 0
  ) {

    relationship.innerHTML =
      `<div class="message success">
        ✅ მეგობრები ხართ
      </div>`;

    addBtn.classList.add("hidden");

    return;

  }


  const {
    data: requests,
    error: requestError
  } =
    await supabaseClient
      .from("friend_requests")
      .select(
        "id,sender_id,receiver_id,status"
      )
      .or(
        "and(sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        user.id +
        "),and(sender_id.eq." +
        user.id +
        ",receiver_id.eq." +
        currentUser.id +
        ")"
      )
      .eq("status", "pending");


  if (requestError) {
    console.error(requestError);
  }


  const outgoing =
    (requests || []).find(
      function(request) {

        return (
          request.sender_id ===
          currentUser.id
        );

      }
    );


  const incoming =
    (requests || []).find(
      function(request) {

        return (
          request.receiver_id ===
          currentUser.id
        );

      }
    );


  if (incoming) {

    relationship.innerHTML =
      `<div class="message">
        👋 ${escapeHtml(user.username)}-მა
        გამოგიგზავნა მოთხოვნა.
      </div>

      <button class="success-btn accept-inline">
        მიღება
      </button>

      <button class="danger-btn reject-inline">
        უარყოფა
      </button>`;


    addBtn.classList.add("hidden");


    relationship
      .querySelector(".accept-inline")
      .addEventListener(
        "click",
        async function() {

          try {

            await acceptFriendRequest(
              incoming.id
            );

            await renderRelationship(
              user,
              box
            );

          } catch (error) {

            alert(error.message);

          }

        }
      );


    relationship
      .querySelector(".reject-inline")
      .addEventListener(
        "click",
        async function() {

          try {

            await rejectFriendRequest(
              incoming.id
            );

            await renderRelationship(
              user,
              box
            );

          } catch (error) {

            alert(error.message);

          }

        }
      );


    return;

  }


  if (outgoing) {

    relationship.innerHTML =
      `<div class="message">
        ⏳ მოთხოვნა გაგზავნილია.
      </div>`;

    addBtn.classList.add("hidden");

    return;

  }


  addBtn.classList.remove("hidden");


  relationship.innerHTML =
    `<div class="small">
      ჯერ მეგობრები არ ხართ.
      სურვილის შემთხვევაში შეგიძლია ჩატიც დაიწყო.
    </div>`;

}


/* =========================================================
   SEND FRIEND REQUEST
========================================================= */

async function sendFriendRequest(user) {

  try {

    if (user.id === currentUser.id) {

      throw new Error(
        "საკუთარ თავს მეგობრებში ვერ დაამატებ."
      );

    }


    const {
      data: friendship
    } =
      await supabaseClient
        .from("friendships")
        .select("id")
        .or(
          "and(user_id.eq." +
          currentUser.id +
          ",friend_id.eq." +
          user.id +
          "),and(user_id.eq." +
          user.id +
          ",friend_id.eq." +
          currentUser.id +
          ")"
        )
        .limit(1);


    if (
      friendship &&
      friendship.length > 0
    ) {

      alert(
        "ეს მომხმარებელი უკვე მეგობრებშია."
      );

      return;

    }


    const {
      data: existing
    } =
      await supabaseClient
        .from("friend_requests")
        .select(
          "id,sender_id,receiver_id,status"
        )
        .or(
          "and(sender_id.eq." +
          currentUser.id +
          ",receiver_id.eq." +
          user.id +
          "),and(sender_id.eq." +
          user.id +
          ",receiver_id.eq." +
          currentUser.id +
          ")"
        )
        .eq("status", "pending");


    if (
      existing &&
      existing.length > 0
    ) {

      const request =
        existing[0];


      if (
        request.receiver_id ===
        currentUser.id
      ) {

        await acceptFriendRequest(
          request.id
        );

        alert(
          "მეგობრობის მოთხოვნა მიღებულია."
        );

        return;

      }


      alert(
        "მოთხოვნა უკვე გაგზავნილია."
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .insert({

          sender_id:
            currentUser.id,

          receiver_id:
            user.id,

          status:
            "pending"

        });


    if (error) {
      throw error;
    }


    alert(
      "მეგობრობის მოთხოვნა გაიგზავნა."
    );


    await loadFriendRequests();


  } catch (error) {

    console.error(error);

    alert(error.message);

  }

}

/* =========================================================
   FRIEND REQUEST LIST
========================================================= */

async function loadFriendRequests() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("friend_requests")
      .select(
        "id,sender_id,receiver_id,status,created_at"
      )
      .eq(
        "receiver_id",
        currentUser.id
      )
      .eq(
        "status",
        "pending"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  const renderKey =
    (data || [])
      .map(
        function(request) {

          return (
            request.id +
            ":" +
            request.status +
            ":" +
            request.created_at
          );

        }
      )
      .join("|");


  if (
    renderKey ===
    lastFriendRequestRenderKey
  ) {

    return;

  }


  lastFriendRequestRenderKey =
    renderKey;


  if (!data || data.length === 0) {

    $("friendRequests").innerHTML =
      `<div class="small">
        ახალი მოთხოვნები არ არის.
      </div>`;

    return;

  }


  const fragment =
    document.createDocumentFragment();


  for (const request of data) {

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient.rpc(
        "find_profile_by_id",
        {
          profile_id: request.sender_id
        }
      );


    if (profileError) {
      continue;
    }


    const username =
      profile &&
      profile.length
        ? profile[0].username
        : "მომხმარებელი";


    const box =
      document.createElement("div");


    box.className =
      "request-item";


    box.innerHTML =
      `<strong>
        👤 ${escapeHtml(username)}
      </strong>

      <div class="small">
        გიგზავნის მეგობრობის მოთხოვნას.
      </div>

      <button class="success-btn accept-btn">
        მიღება
      </button>

      <button class="danger-btn reject-btn">
        უარყოფა
      </button>

      <button class="chat-btn">
        💬 ჩატი
      </button>`;


    box
      .querySelector(".accept-btn")
      .addEventListener(
        "click",
        async function() {

          try {

            await acceptFriendRequest(
              request.id
            );

          } catch (error) {

            alert(error.message);

          }

        }
      );


    box
      .querySelector(".reject-btn")
      .addEventListener(
        "click",
        async function() {

          try {

            await rejectFriendRequest(
              request.id
            );

          } catch (error) {

            alert(error.message);

          }

        }
      );


    box
      .querySelector(".chat-btn")
      .addEventListener(
        "click",
        async function() {

          await selectUser({

            id:
              request.sender_id,

            username:
              username

          });

        }
      );


    fragment.appendChild(box);

  }


  $("friendRequests").innerHTML = "";

  $("friendRequests")
    .appendChild(fragment);

}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

  if (
    !currentUser ||
    !selectedUser ||
    isLoadingMessages
  ) {

    return;

  }


  isLoadingMessages = true;


  try {

    const selectedUserId =
      selectedUser.id;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,sender_id,receiver_id,message,created_at,read_at,file_name,file_path,file_type,file_size,expires_at"
        )
        .or(
          "and(sender_id.eq." +
          currentUser.id +
          ",receiver_id.eq." +
          selectedUserId +
          "),and(sender_id.eq." +
          selectedUserId +
          ",receiver_id.eq." +
          currentUser.id +
          ")"
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    if (
      !selectedUser ||
      selectedUser.id !== selectedUserId
    ) {

      return;

    }


    const now =
      Date.now();


    const messages =
      (data || []).filter(
        function(message) {

          if (!message.expires_at) {
            return true;
          }

          return (
            new Date(message.expires_at).getTime() >
            now
          );

        }
      );


    renderMessages(messages);


    const unread =
      messages.filter(
        function(message) {

          return (
            message.receiver_id ===
            currentUser.id
            &&
            message.read_at ===
            null
          );

        }
      );


    for (const message of unread) {

      try {

        await supabaseClient.rpc(
          "mark_message_read",
          {
            message_id:
              message.id
          }
        );

      } catch (error) {

        console.error(
          "Read error:",
          error
        );

      }

    }


    if (unread.length > 0) {

      lastConversationRenderKey = "";

      await loadConversations();

    }


  } catch (error) {

    console.error(error);

    $("messages").innerHTML =
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;

  } finally {

    isLoadingMessages = false;

  }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages) {

  const key =
    messages
      .map(
        function(message) {

          return (
            message.id +
            ":" +
            message.read_at +
            ":" +
            message.file_path +
            ":" +
            message.expires_at
          );

        }
      )
      .join("|");


  if (
    key ===
    lastMessageRenderKey
  ) {

    return;

  }


  lastMessageRenderKey =
    key;


  const container =
    $("messages");


  const shouldScroll =
    (
      container.scrollHeight -
      container.scrollTop -
      container.clientHeight
    ) < 100;


  container.innerHTML = "";


  if (messages.length === 0) {

    container.innerHTML =
      `<div class="small">
        ჯერ შეტყობინებები არ არის.
      </div>`;

    return;

  }


  const fragment =
    document.createDocumentFragment();


  for (const message of messages) {

    const mine =
      message.sender_id ===
      currentUser.id;


    const row =
      document.createElement("div");


    row.className =
      "chat-message " +
      (
        mine
          ? "mine"
          : ""
      );


    const bubble =
      document.createElement("div");


    bubble.className =
      "bubble";


    if (
      message.file_path
    ) {

      const fileBox =
        document.createElement("div");


      fileBox.className =
        "chat-file";


      const fileName =
        document.createElement("div");


      fileName.className =
        "chat-file-name";


      fileName.textContent =
        "📎 " +
        (
          message.file_name ||
          "ფაილი"
        );


      const fileSize =
        document.createElement("div");


      fileSize.className =
        "chat-file-size";


      fileSize.textContent =
        formatFileSize(
          message.file_size
        );


      const openButton =
        document.createElement("button");


      openButton.className =
        "open-chat-file-btn";


      openButton.textContent =
        "📥 გახსნა";


      openButton.addEventListener(
        "click",
        async function() {

          await openChatFile(
            message
          );

        }
      );


      fileBox.appendChild(fileName);
      fileBox.appendChild(fileSize);
      fileBox.appendChild(openButton);

      bubble.appendChild(fileBox);

    }


    if (
      message.message &&
      message.message.trim() !== "" &&
      !message.file_path
    ) {

      const text =
        document.createElement("div");


      text.textContent =
        message.message;


      bubble.appendChild(text);

    }


    const time =
      document.createElement("div");


    time.className =
      "message-time";


    time.textContent =
      formatTime(
        message.created_at
      );


    bubble.appendChild(time);


    if (message.expires_at) {

      const expiry =
        document.createElement("div");


      expiry.className =
        "message-expiry";


      expiry.textContent =
        "⏳ იშლება: " +
        formatTime(
          message.expires_at
        );


      bubble.appendChild(expiry);

    }


    if (mine) {

      const deleteButton =
        document.createElement("button");


      deleteButton.className =
        "delete-message-btn";


      deleteButton.textContent =
        "🗑️ წაშლა";


      deleteButton.addEventListener(
        "click",
        async function() {

          await deleteMessage(
            message
          );

        }
      );


      bubble.appendChild(
        deleteButton
      );

    }


    row.appendChild(bubble);

    fragment.appendChild(row);

  }


  container.appendChild(fragment);


  if (shouldScroll) {

    container.scrollTop =
      container.scrollHeight;

  }

}

    } =

        );

    }


    const {
      error: dbError
    } =
      await supabaseClient
        .from("messages")
        .insert({

          sender_id:
            currentUser.id,

          receiver_id:
            selectedUser.id,

          message:
            "",

          file_name:
            file.name,

          file_path:

            file.type ||

      .textContent =

/* =========================================================
   DELETE MESSAGE
========================================================= */

async function deleteMessage(message) {

  if (
    !currentUser ||
    message.sender_id !== currentUser.id
  ) {

    return;

  }


  if (
    !confirm(
      "ნამდვილად გინდა ამ შეტყობინების წაშლა?"
    )
  ) {

    return;

  }


  try {

    $("messageStatus")
      .textContent =
      "იშლება...";


    /*
      ჯერ Storage-იდან ვშლით ფაილს,
      თუ შეტყობინებას ფაილი აქვს.
    */

    if (message.file_path) {

      const {
        error: storageError
      } =
        await supabaseClient
          .storage
          .from("user-files")
          .remove([
            message.file_path
          ]);


      if (storageError) {
        throw storageError;
      }

    }


    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .delete()
        .eq(
          "id",
          message.id
        )
        .eq(
          "sender_id",
          currentUser.id
        );


    if (error) {
      throw error;
    }


    $("messageStatus")
      .textContent =
      "✅ შეტყობინება წაიშალა.";


    lastMessageRenderKey = "";
    lastConversationRenderKey = "";


    await loadMessages();
    await loadConversations();


    setTimeout(
      function() {

        $("messageStatus")
          .textContent = "";

      },
      1500
    );


  } catch (error) {

    console.error(error);

    $("messageStatus")
      .textContent =
      "წაშლის შეცდომა: " +
      error.message;

  }

}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,sender_id,receiver_id,message,created_at,read_at,file_name,file_path,expires_at"
      )
      .or(
        "sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  const now =
    Date.now();


  const activeMessages =
    (data || []).filter(
      function(message) {

        if (!message.expires_at) {
          return true;
        }

        return (
          new Date(
            message.expires_at
          ).getTime() > now
        );

      }
    );


  const conversations =
    new Map();


  for (
    const message
    of activeMessages
  ) {

    const otherId =
      message.sender_id ===
      currentUser.id
        ? message.receiver_id
        : message.sender_id;


    if (
      !conversations.has(otherId)
    ) {

      conversations.set(
        otherId,
        {
          lastMessage:
            message,

          unread:
            0,

          username:
            null
        }
      );

    }


    if (
      message.receiver_id ===
      currentUser.id &&
      message.read_at ===
      null
    ) {

      conversations
        .get(otherId)
        .unread++;

    }

  }


  if (
    conversations.size ===
    0
  ) {

    if (
      lastConversationRenderKey !==
      "empty"
    ) {

      lastConversationRenderKey =
        "empty";

      $("conversations").innerHTML =
        `<div class="small">
          ჯერ ჩატი არ გაქვს.
        </div>`;

    }

    return;

  }


  for (
    const [
      userId,
      conversation
    ]
    of conversations
  ) {

    const {
      data: profile
    } =
      await supabaseClient.rpc(
        "find_profile_by_id",
        {
          profile_id:
            userId
        }
      );


    conversation.username =
      profile &&
      profile.length
        ? profile[0].username
        : "მომხმარებელი";

  }


  const conversationKey =
    Array.from(
      conversations.entries()
    )
      .map(
        function([
          userId,
          conversation
        ]) {

          return (
            userId +
            ":" +
            conversation.lastMessage.id +
            ":" +
            conversation.lastMessage.read_at +
            ":" +
            conversation.unread
          );

        }
      )
      .join("|");


  if (
    conversationKey ===
    lastConversationRenderKey
  ) {

    return;

  }


  lastConversationRenderKey =
    conversationKey;


  const fragment =
    document.createDocumentFragment();


  for (
    const [
      userId,
      conversation
    ]
    of conversations
  ) {

    const item =
      document.createElement("div");


    item.className =
      "conversation-item";


    if (
      selectedUser &&
      selectedUser.id ===
      userId
    ) {

      item.classList.add(
        "active"
      );

    }


    if (
      conversation.unread > 0
    ) {

      item.classList.add(
        "unread"
      );

    }


    const lastMessage =
      conversation.lastMessage;


    let preview =
      lastMessage.message || "";


    if (
      lastMessage.file_path
    ) {

      preview =
        "📎 " +
        (
          lastMessage.file_name ||
          "ფაილი"
        );

    }


    if (
      preview.length > 50
    ) {

      preview =
        preview.substring(
          0,
          50
        ) +
        "...";

    }


    item.innerHTML =
      `<strong>
        👤 ${escapeHtml(
          conversation.username
        )}

        ${
          conversation.unread > 0
            ? `<span class="badge">
                ${conversation.unread}
              </span>`
            : ""
        }

      </strong>

      <div class="small">
        ${escapeHtml(preview)}
      </div>

      <div class="small">
        ${formatTime(
          lastMessage.created_at
        )}
      </div>`;


    item.addEventListener(
      "click",
      async function() {

        await selectUser({

          id:
            userId,

          username:
            conversation.username

        });


        lastConversationRenderKey = "";

        await loadConversations();

      }
    );


    fragment.appendChild(item);

  }


  $("conversations").innerHTML = "";

  $("conversations")
    .appendChild(fragment);

}


/* =========================================================
   PERSONAL FILE UPLOAD
========================================================= */

$("uploadBtn").addEventListener(
  "click",

);


async function uploadFile() {

  const input =
    $("fileInput");


  if (
    !input.files ||
    input.files.length === 0
  ) {

    $("fileMessage")
      .textContent =
      "ჯერ აირჩიე ფაილი.";

    return;

  }


  const file =
    input.files[0];


  if (
    file.size >
    50 * 1024 * 1024
  ) {

    $("fileMessage")
      .textContent =
      "ფაილი 50 MB-ზე დიდი არ უნდა იყოს.";

    return;

  }


  $("uploadBtn").disabled =
    true;


  $("fileMessage")
    .textContent =
    "იტვირთება...";


  try {

    const path =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "-" +
      safeFileName(file.name);


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("user-files")
        .upload(
          path,
          file,
          {
            upsert: false,

            contentType:
              file.type ||
              "application/octet-stream"
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    const expires =
      new Date(
        Date.now() +
        3 * 24 * 60 * 60 * 1000
      )
      .toISOString();


    const {
      error: dbError
    } =
      await supabaseClient
        .from("files")
        .insert({

          user_id:
            currentUser.id,

          file_name:
            file.name,

          storage_path:
            path,

          file_type:
            file.type ||
            "application/octet-stream",

          file_size:
            file.size,

          expires_at:
            expires

        });


    if (dbError) {

      await supabaseClient
        .storage
        .from("user-files")
        .remove([path]);

      throw dbError;

    }


    input.value = "";


    $("fileMessage")
      .textContent =
      "ფაილი წარმატებით აიტვირთა.";


    await loadFiles();


  } catch (error) {

    console.error(error);

    $("fileMessage")
      .textContent =
      "შეცდომა: " +
      error.message;

  } finally {

    $("uploadBtn").disabled =
      false;

  }

}


/* =========================================================
   LOAD PERSONAL FILES
========================================================= */

async function loadFiles() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("files")
      .select(
        "id,file_name,storage_path,file_type,file_size,created_at,expires_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    $("filesList").innerHTML =
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  const now =
    Date.now();


  const activeFiles =
    (data || []).filter(
      function(file) {

        if (!file.expires_at) {
          return true;
        }

        return (
          new Date(
            file.expires_at
          ).getTime() > now
        );

      }
    );


  if (
    activeFiles.length ===
    0
  ) {

    $("filesList").innerHTML =
      `<div class="small">
        ფაილები არ არის.
      </div>`;

    return;

  }


  $("filesList").innerHTML = "";


  const fragment =
    document.createDocumentFragment();


  for (
    const file
    of activeFiles
  ) {

    const item =
      document.createElement("div");


    item.className =
      "file-item";


    item.innerHTML =
      `<strong>
        📄 ${escapeHtml(
          file.file_name
        )}
      </strong>

      <div class="small">
        ვადა:
        ${formatTime(
          file.expires_at
        )}
      </div>

      <button class="open-file">
        გახსნა
      </button>

      <button class="delete-file danger-btn">
        წაშლა
      </button>`;


    item
      .querySelector(".open-file")
      .addEventListener(
        "click",
        async function() {

          await openFile(file);

        }
      );


    item
      .querySelector(".delete-file")
      .addEventListener(
        "click",
        async function() {

          await deleteFile(file);

        }
      );


    fragment.appendChild(item);

  }


  $("filesList").innerHTML = "";

  $("filesList")
    .appendChild(fragment);

}

/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime() {

  if (!currentUser) {
    return;
  }


  if (messageChannel) {

    supabaseClient
      .removeChannel(
        messageChannel
      );

  }


  if (friendRequestChannel) {

    supabaseClient
      .removeChannel(
        friendRequestChannel
      );

  }


  messageChannel =
    supabaseClient
      .channel(
        "messages-" +
        currentUser.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },
        async function(payload) {

          const message =
            payload.new ||
            payload.old;


          if (!message) {
            return;
          }


          if (
            message.sender_id !==
              currentUser.id &&
            message.receiver_id !==
              currentUser.id
          ) {

            return;

          }


          if (
            selectedUser &&
            (
              (
                message.sender_id ===
                selectedUser.id &&
                message.receiver_id ===
                currentUser.id
              )
              ||
              (
                message.receiver_id ===
                selectedUser.id &&
                message.sender_id ===
                currentUser.id
              )
            )
          ) {

            lastMessageRenderKey = "";

            await loadMessages();

          }


          lastConversationRenderKey = "";

          await loadConversations();

        }
      )
      .subscribe();


  friendRequestChannel =
    supabaseClient
      .channel(
        "friend-requests-" +
        currentUser.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "friend_requests"
        },
        async function(payload) {

          const row =
            payload.new ||
            payload.old;


          if (!row) {
            return;
          }


          if (
            row.sender_id ===
              currentUser.id ||
            row.receiver_id ===
              currentUser.id
          ) {

            lastFriendRequestRenderKey = "";

            await loadFriendRequests();

          }

        }
      )
      .subscribe();

}


/* =========================================================
   POLLING FALLBACK
========================================================= */

function startPolling() {

  stopPolling();


  pollingTimer =
    setInterval(
      async function() {

        if (!currentUser) {
          return;
        }


        await loadFriendRequests();

        await loadConversations();


        if (selectedUser) {

          await loadMessages();

        }

        await loadFiles();

      },
      15000
    );

}


function stopPolling() {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer = null;

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async function(event, session) {

    if (
      event ===
      "PASSWORD_RECOVERY"
    ) {

      $("authScreen")
        .classList.remove("hidden");

      $("appScreen")
        .classList.add("hidden");

      $("loginBox")
        .classList.add("hidden");

      $("registerBox")
        .classList.add("hidden");

      $("forgotBox")
        .classList.add("hidden");

      $("recoveryBox")
        .classList.remove("hidden");

      return;

    }


    if (
      session &&
      session.user &&
      !currentUser
    ) {

      try {

        await startApp();

      } catch (error) {

        console.error(error);

        showMessage(
          $("loginMessage"),
          error.message,
          "error"
        );

      }

    }

  }
);


/* =========================================================
   INITIAL SESSION
========================================================= */

(async function init() {

  try {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      await startApp();

    }

  } catch (error) {

    console.error(
      "Init error:",
      error
    );

  }

})();
